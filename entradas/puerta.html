<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puerta · Entradas SMRHC</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<style>
:root{--navy:#001392;--blue:#1d4ed8;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0d;color:#fff;font-family:var(--font);-webkit-text-size-adjust:100%;height:100%}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
.login{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center}
.login img{width:96px;height:96px;object-fit:contain}
.login h1{margin:0;font-size:1.4rem}
.login input{border:1px solid #2a2b31;background:#16171b;border-radius:12px;padding:14px;font-size:1.3rem;text-align:center;letter-spacing:.3em;width:220px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;background:var(--blue);color:#fff;font-size:1rem;cursor:pointer}
.btn.sec{background:#1f2026;border:1px solid #2a2b31}
.err{background:#3b1212;color:#fca5a5;border-radius:10px;padding:10px 12px;font-size:.92rem}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px}
.hd{display:flex;align-items:center;gap:10px}
.hd img{width:34px;height:34px;object-fit:contain}
.hd .tt{flex:1}
.hd b{display:block;font-size:1.05rem}
.hd small{color:#9ca3af;font-size:.85rem}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;color:#fff}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .off{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:20px;color:#d1d5db}
.manual{display:flex;gap:8px}
.manual input{flex:1;border:1px solid #2a2b31;background:#16171b;border-radius:12px;padding:13px 14px;font-size:1.05rem;text-transform:uppercase}
.res{position:fixed;inset:0;z-index:10;display:grid;place-content:center;justify-items:center;text-align:center;padding:30px;gap:10px}
.res.ok{background:#15803d}.res.ya{background:#b45309}.res.no{background:#b91c1c}
.res .ic{font-size:5rem;line-height:1}
.res h2{margin:0;font-size:2.1rem;line-height:1.1;overflow-wrap:anywhere}
.res p{margin:0;font-size:1.2rem;opacity:.95}
.res code{font-size:1.1rem;opacity:.85}
.res small{opacity:.85;margin-top:16px}
.ult{display:grid;gap:6px}
.ult div{display:flex;gap:8px;font-size:.9rem;color:#d1d5db;background:#16171b;border-radius:10px;padding:8px 10px}
.ult code{color:#93c5fd}
.ult .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="login" class="login">
  <img src="logo.png" alt="Escudo SMRHC">
  <h1>Control de puerta</h1>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN de puerta">
  <button id="entrar" class="btn" style="width:220px">Entrar</button>
  <div id="login-err"></div>
</div>

<div id="app" class="app hidden">
  <div class="hd"><img src="logo.png" alt=""><div class="tt"><b>Control de puerta</b><small>Ingresaron <span class="count" id="cnt">–</span></small></div>
    <button id="salir" class="btn sec" style="padding:8px 12px;font-size:.88rem">Salir</button></div>
  <div class="cam"><video id="video" playsinline muted></video><div class="frame" id="frame"></div>
    <div class="off" id="off"><span>Apuntá la cámara al código QR de la entrada.</span><button id="cam" class="btn">📷 Activar cámara</button></div></div>
  <div class="manual"><input id="codigo" placeholder="SMR-009" aria-label="Número de entrada" autocomplete="off"><button id="buscar" class="btn">Validar</button></div>
  <div class="ult" id="ult"></div>
</div>
<div id="res" class="res hidden" role="alert"></div>

<script src="comun.js"></script>
<script>
const el = id => document.getElementById(id);
const S = { pin: guardado('pin') || '', stream: null, det: null, busy: false, ult: [], ultimo: '', ultimoAt: 0 };

async function entrar() {
  const pin = el('pin').value.trim();
  el('login-err').innerHTML = '';
  try {
    await rpc('ent_login', { p_pin: pin });
    S.pin = pin; guardado('pin', pin);
    el('login').classList.add('hidden'); el('app').classList.remove('hidden');
    contar(); camara();
  } catch (e) { el('login-err').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function salir() {
  S.pin = ''; guardado('pin', null); parar();
  el('app').classList.add('hidden'); el('login').classList.remove('hidden'); el('pin').value = '';
}
el('entrar').onclick = entrar;
el('pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
el('salir').onclick = salir;

async function contar() {
  try { const r = await rpc('ent_resumen', { p_pin: S.pin }); el('cnt').textContent = `${r.ingresaron} de ${r.pagadas}`; } catch (e) { /* sigue */ }
}

// ---------- cámara ----------
async function camara() {
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    el('off').querySelector('span').textContent = 'No se pudo usar la cámara. Dale permiso en el navegador o escribí el número de entrada abajo.';
    return;
  }
  const v = el('video'); v.srcObject = S.stream; await v.play().catch(() => {});
  el('off').classList.add('hidden');
  if ('BarcodeDetector' in window) {
    try { S.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { S.det = null; }
  }
  if (!S.det && !window.jsQR) await new Promise(ok => { const s = document.createElement('script'); s.src = 'vendor/jsQR.js'; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
  leer();
}
function parar() { if (S.stream) S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
async function leer() {
  if (!S.stream) return;
  const v = el('video');
  if (!S.busy && v.readyState >= 2) {
    let txt = '';
    try {
      if (S.det) { const r = await S.det.detect(v); txt = r[0] && r[0].rawValue; }
      else if (window.jsQR) {
        const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
        cv.width = v.videoWidth * k; cv.height = v.videoHeight * k;
        cx.drawImage(v, 0, 0, cv.width, cv.height);
        const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
        txt = r && r.data;
      }
    } catch (e) { /* cuadro siguiente */ }
    // el mismo QR frente a la cámara no se vuelve a validar enseguida
    if (txt && !(txt === S.ultimo && Date.now() - S.ultimoAt < 6000)) { S.ultimo = txt; S.ultimoAt = Date.now(); await validar(txt); }
  }
  setTimeout(() => requestAnimationFrame(leer), 120);
}
el('cam').onclick = camara;

// ---------- validar ----------
async function validar(codigo) {
  if (S.busy || !codigo.trim()) return;
  S.busy = true;
  let r;
  try { r = await rpc('ent_ingreso', { p_pin: S.pin, p_codigo: codigo.trim() }); }
  catch (e) {
    S.busy = false;
    if (e.code === '28000') { salir(); el('login-err').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    return mostrar('no', '⚠️', 'Sin conexión', e.message);
  }
  if (r.resultado === 'ok') {
    S.ult.unshift(r); S.ult = S.ult.slice(0, 5); pintarUlt(); contar();
    mostrar('ok', '✓', r.nombre, r.tipo, r.codigo);
  } else if (r.resultado === 'ya_ingreso') {
    mostrar('ya', '⚠️', 'YA INGRESÓ', `${r.nombre} entró a las ${hora(r.ingreso_at)}`, r.codigo);
  } else {
    mostrar('no', '✕', r.resultado === 'no_pagada' ? 'NO PAGADA' : 'NO VÁLIDA', r.nombre ? `${r.nombre} · ${r.mensaje}` : r.mensaje, r.codigo);
  }
}
function mostrar(tipo, ic, titulo, texto, codigo) {
  const x = el('res');
  x.className = 'res ' + tipo;
  x.innerHTML = `<div class="ic">${ic}</div><h2>${esc(titulo)}</h2><p>${esc(texto || '')}</p>${codigo ? `<code>${esc(codigo)}</code>` : ''}<small>Tocá para seguir</small>`;
  if (navigator.vibrate) navigator.vibrate(tipo === 'ok' ? 120 : [200, 100, 200]);
  const fin = () => { x.classList.add('hidden'); S.busy = false; clearTimeout(t); };
  const t = setTimeout(fin, tipo === 'ok' ? 2200 : 5000);
  x.onclick = fin;
}
function pintarUlt() {
  el('ult').innerHTML = S.ult.map(r => `<div><code>${esc(r.codigo)}</code><span class="n">${esc(r.nombre)} · ${esc(r.tipo)}</span><span>${hora(r.ingreso_at)}</span></div>`).join('');
}
el('buscar').onclick = () => { validar(el('codigo').value); el('codigo').value = ''; };
el('codigo').onkeydown = e => { if (e.key === 'Enter') el('buscar').click(); };
setInterval(() => { if (S.pin && !document.hidden) contar(); }, 30000);

if (S.pin) { el('pin').value = S.pin; entrar(); }
</script>
</body>
</html>
